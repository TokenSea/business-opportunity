apiVersion: v1
kind: Service
metadata:
  name: business-opportunity-mysql
  namespace: tokensea
  labels:
    app: business-opportunity-mysql
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    app: business-opportunity-mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: business-opportunity-mysql
  namespace: tokensea
  labels:
    app: business-opportunity-mysql
spec:
  serviceName: business-opportunity-mysql
  replicas: 1
  selector:
    matchLabels:
      app: business-opportunity-mysql
  template:
    metadata:
      labels:
        app: business-opportunity-mysql
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mysql
          image: mysql:8.4.6
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: business-opportunity-mysql
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: business-opportunity-mysql
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: business-opportunity-mysql
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: business-opportunity-mysql
                  key: MYSQL_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: cbs-tekton-prod
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: business-opportunity-uploads
  namespace: tokensea
  labels:
    app: business-opportunity
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: cbs-tekton-prod
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-opportunity
  namespace: tokensea
  labels:
    app: business-opportunity
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: business-opportunity
  template:
    metadata:
      labels:
        app: business-opportunity
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: migrate
          image: tokensea.tencentcloudcr.com/tokensea/business-opportunity:bootstrap
          imagePullPolicy: IfNotPresent
          command:
            - npx
            - prisma
            - migrate
            - deploy
          envFrom:
            - secretRef:
                name: business-opportunity-app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
      containers:
        - name: business-opportunity
          image: tokensea.tencentcloudcr.com/tokensea/business-opportunity:bootstrap
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: UPLOAD_DIR
              value: /app/storage/uploads
          envFrom:
            - secretRef:
                name: business-opportunity-app
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
          volumeMounts:
            - name: uploads
              mountPath: /app/storage/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: business-opportunity-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: business-opportunity
  namespace: tokensea
  labels:
    app: business-opportunity
spec:
  type: LoadBalancer
  selector:
    app: business-opportunity
  ports:
    - name: http
      port: 80
      targetPort: http

